name: claude-review

# PR-time security review. Hint, not a gate — branch protection requires the
# deterministic checks (semgrep, codeql, audit). Print mode with bounded budget.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip when Claude API key is not configured
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "ANTHROPIC_API_KEY is not configured; skipping Claude review."

      - uses: actions/checkout@v4
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        with:
          fetch-depth: 0  # need history for `git diff main...HEAD`

      - name: Install Claude Code from its signed apt repository
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          curl -fsSL https://downloads.claude.ai/keys/claude-code.asc -o "$key_file"
          fingerprint="$(
            gpg --batch --show-keys --with-colons "$key_file" \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test "$fingerprint" = "31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE"

          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "$key_file" /etc/apt/keyrings/claude-code.asc
          echo "deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/stable stable main" \
            | sudo tee /etc/apt/sources.list.d/claude-code.list >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y claude-code

      - name: Run /security-review
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          claude -p "/security-review" \
            --max-turns 5 \
            --max-budget-usd 2 \
            --output-format json \
            --no-session-persistence \
            > review.json

      - name: Post review as PR comment
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = JSON.parse(fs.readFileSync('review.json', 'utf8'));
            const body = review.result || review.text || '(no findings)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## /security-review\n\n${body}\n\n_Hint, not a gate. See REVIEW.md for the checklist._`,
            });
