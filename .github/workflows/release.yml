name: request trusted release

# Candidate-controlled workflow code never builds, attests, or publishes a
# release. It can only request the separately protected builder, which must
# independently verify the signed tag and its own pinned workflow identity.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  request-trusted-builder:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: trusted-builder-dispatch
    env:
      BUILDER_REPOSITORY: ${{ vars.FIELDWORK_TRUSTED_BUILDER_REPOSITORY }}
      BUILDER_WORKFLOW: ${{ vars.FIELDWORK_TRUSTED_BUILDER_WORKFLOW }}
      BUILDER_REF: ${{ vars.FIELDWORK_TRUSTED_BUILDER_REF }}
      BUILDER_WORKFLOW_SHA: ${{ vars.FIELDWORK_TRUSTED_BUILDER_WORKFLOW_SHA }}
      DISPATCH_TOKEN: ${{ secrets.FIELDWORK_TRUSTED_BUILDER_DISPATCH_TOKEN }}
    steps:
      - name: Validate pinned builder configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILDER_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$BUILDER_WORKFLOW" =~ ^[A-Za-z0-9_.-]+\.ya?ml$ ]]
          [[ "$BUILDER_REF" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$BUILDER_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$DISPATCH_TOKEN" ]]

      - name: Request the separately protected builder
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg ref "$BUILDER_REF" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_ref "refs/tags/$GITHUB_REF_NAME" \
            --arg source_event_oid "$GITHUB_SHA" \
            --arg workflow_sha "$BUILDER_WORKFLOW_SHA" \
            '{ref:$ref,inputs:{source_repository:$repository,source_ref:$source_ref,source_event_oid:$source_event_oid,expected_workflow_sha:$workflow_sha}}')"
          curl --fail-with-body --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/$BUILDER_REPOSITORY/actions/workflows/$BUILDER_WORKFLOW/dispatches"
