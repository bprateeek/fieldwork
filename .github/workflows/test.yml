name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: static-checks.sh
        run: bash tests/static-checks.sh

      - name: broker-validation-tests
        run: python3 tests/broker-validation-tests.py

      - name: bot-tests
        run: python3 tests/bot-tests.py

      - name: pr-prepare-validation-tests
        run: python3 tests/pr-prepare-validation-tests.py

      - name: task-dispatcher-tests
        run: bash tests/task-dispatcher-tests.sh

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck (errors only)
        run: |
          # Lint tracked shell scripts, including extensionless ones with a
          # bash/sh shebang. Scoped to severity=error so the gate catches real
          # bugs rather than drowning in style warnings.
          grep -rlE '^#!.*\b(bash|sh)\b' bin lib tests examples install.sh 2>/dev/null \
            | sort -u | tee /dev/stderr | xargs -r shellcheck -S error

  macos-clients:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Client syntax and macOS launchd contract
        run: |
          while IFS= read -r file; do bash -n "$file"; done \
            < <(grep -rlE '^#!.*\b(bash|sh)\b' bin lib tests examples install.sh 2>/dev/null | sort -u)
          python3 -m py_compile \
            lib/scripts/fieldwork-pr-build lib/scripts/fieldwork-pr-upload \
            lib/scripts/fieldwork-pr-prepare examples/broker-client.py \
            lib/local/control/fieldwork-local-probe
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("lib/local/com.fieldwork.spool-init.plist")
          PY
          python3 examples/broker-client.py --help >/dev/null

      - name: LaunchDaemon bootstrap and volatile-path recreation simulation
        run: |
          probe_plist="$RUNNER_TEMP/com.fieldwork.spool-init.ci.plist"
          installed_plist=/Library/LaunchDaemons/com.fieldwork.spool-init.ci.plist
          cleanup() {
            sudo launchctl bootout system/com.fieldwork.spool-init.ci >/dev/null 2>&1 || true
            sudo rm -f "$installed_plist"
          }
          trap cleanup EXIT
          cp lib/local/com.fieldwork.spool-init.plist "$probe_plist"
          /usr/libexec/PlistBuddy -c 'Set :Label com.fieldwork.spool-init.ci' "$probe_plist"
          /usr/libexec/PlistBuddy -c 'Set :ProgramArguments:0 /usr/bin/true' "$probe_plist"
          sudo install -o root -g wheel -m 0644 "$probe_plist" "$installed_plist"
          sudo launchctl bootstrap system "$installed_plist"
          sudo launchctl bootout system/com.fieldwork.spool-init.ci

          volatile_root="$RUNNER_TEMP/fieldwork-volatile"
          rm -rf "$volatile_root"
          install -d -m 0755 "$volatile_root"
          test -d "$volatile_root"

      - name: Hermetic client and broker validation
        run: |
          python3 tests/pr-prepare-validation-tests.py
          python3 tests/broker-validation-tests.py

  container-architectures:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build pinned local image on native architecture
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --load \
            --tag "fieldwork-local-ci:${{ matrix.arch }}" \
            --file lib/local/Dockerfile .

  local-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the real local broker and query through the excluded uploader
        run: |
          docker compose -p fieldwork-local-ci -f lib/local/docker-compose.yml config >/dev/null
          docker compose -p fieldwork-local-ci -f lib/local/docker-compose.yml up -d --build broker
          token=
          http_status=
          for fw_attempt in {1..30}; do
            token="$(docker compose -p fieldwork-local-ci -f lib/local/docker-compose.yml \
              exec -T broker /usr/local/bin/fieldwork-local-entrypoint read-http-auth 2>/dev/null || true)"
            http_status="$(docker compose -p fieldwork-local-ci -f lib/local/docker-compose.yml \
              exec -T broker /usr/bin/curl --silent --output /dev/null \
              --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' \
              --data '{}' http://127.0.0.1:8377/pr-status 2>/dev/null || true)"
            if [[ "$token" =~ ^[0-9a-f]{64}$ ]] && [ "$http_status" = 401 ]; then
              break
            fi
            sleep 1
          done
          if ! [[ "$token" =~ ^[0-9a-f]{64}$ ]] || [ "$http_status" != 401 ]; then
            docker compose -p fieldwork-local-ci -f lib/local/docker-compose.yml ps
            docker compose -p fieldwork-local-ci -f lib/local/docker-compose.yml logs --no-color --tail=100 broker
            exit 1
          fi
          install -d -m 700 "$HOME/.fieldwork"
          umask 077
          printf '%s\n' "$token" >"$HOME/.fieldwork/http-auth"
          status=0
          output="$(python3 -I lib/scripts/fieldwork-pr-upload \
            --status 00000000-0000-4000-8000-000000000001 2>&1)" || status=$?
          if [ "$status" -ne 1 ] || ! grep -Fq unknown_request <<<"$output"; then
            printf '%s\n' "$output" >&2
            exit 1
          fi

      - name: Hermetic pack and approval smoke
        run: |
          bash bin/fieldwork eval up
          bash bin/fieldwork eval smoke

      - name: Tear down local and evaluation containers
        if: always()
        run: |
          bash bin/fieldwork eval down || true
          docker compose -p fieldwork-local-ci -f lib/local/docker-compose.yml down -v --remove-orphans || true
